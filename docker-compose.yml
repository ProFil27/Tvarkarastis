services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Vykdoma tik pirma karta, kai duomenu aplankas tuscias.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      # N-05: naršyklė jungiasi per localhost
      - "127.0.0.1:5000:5000"
    volumes:
      # kodo pakeitimai matomi be perkrovimo (Flask debug reloader)
      - ./app:/app/app

volumes:
  pgdata:
