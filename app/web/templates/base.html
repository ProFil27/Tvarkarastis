<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tvarkaraštis{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
{% block layout %}
    <div class="nav">
        <a class="brand" href="{{ url_for('home.index') }}"><div class="logo">▦</div>Tvarkaraštis</a>
        <div class="tabs">
            <a class="tab {{ 'on' if request.blueprint in ('week', 'schedule') }}" href="{{ url_for('week.view') }}">Tvarkaraštis</a>
            <a class="tab {{ 'on' if request.blueprint == 'work_shifts' }}" href="{{ url_for('work_shifts.list_shifts') }}">Darbo valandos</a>
        </div>
        <div class="user">
            <div class="avatar">{{ session.get('user_name')|initials }}</div>
            <form method="post" action="{{ url_for('auth.logout') }}">
                <button type="submit" class="out">Atsijungti</button>
            </form>
        </div>
    </div>
    <div class="wrap">
        {% include "_flashes.html" %}
        {% block content %}{% endblock %}
    </div>
{% endblock %}
</body>
</html>
