{% extends "base.html" %}
{% block title %}Prisijungimas{% endblock %}
{% block content %}
    <h1>Prisijungimas</h1>
    <form method="post" novalidate>
        <div>
            <label for="email">El. paštas</label>
            <input type="email" id="email" name="email" value="{{ form.get('email', '') }}"
                   class="{{ 'invalid' if error }}">
        </div>
        <div>
            <label for="password">Slaptažodis</label>
            <input type="password" id="password" name="password"
                   class="{{ 'invalid' if error }}">
        </div>
        {% if error %}<div class="field-error">{{ error }}</div>{% endif %}
        <button type="submit">Prisijungti</button>
    </form>
    <p>Neturite paskyros? <a href="{{ url_for('auth.register') }}">Registruotis</a></p>
{% endblock %}
