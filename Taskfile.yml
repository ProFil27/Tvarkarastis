# https://taskfile.dev  (Windows: winget install Task.Task)
# Entry point: `task` (or `task up`) starts everything automatically.
version: "3"

tasks:
  default:
    desc: Start the whole system (DB + application)
    cmds:
      - task: up

  env:
    desc: Create .env from .env.example if it does not exist
    status:
      - test -f .env
    cmds:
      - cp .env.example .env
      - echo "Created .env - fill in GEMINI_API_KEY and the passwords, then run 'task up' again."
      - exit 1

  up:
    desc: Build and start the DB and the application (http://127.0.0.1:5000)
    deps: [env]
    cmds:
      - docker compose up --build -d
      - echo "System is running - http://127.0.0.1:5000"

  down:
    desc: Stop the system (data is kept)
    cmds:
      - docker compose down

  reset:
    desc: Stop and delete DB data (the schema is recreated on next start)
    cmds:
      - docker compose down -v

  logs:
    desc: Follow the application log
    cmds:
      - docker compose logs -f app

  seed:
    desc: Load demo data (db/seed.sql, N-16)
    cmds:
      - docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < db/seed.sql

  psql:
    desc: Open a psql shell
    interactive: true
    cmds:
      - docker compose exec db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
